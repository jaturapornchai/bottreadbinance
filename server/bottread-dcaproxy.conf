# BotTread: the PC's tunnel user may only open -L to the DCA service; no -R listeners, no shell (README หัวข้อ Auto Short).
# Install: /etc/ssh/sshd_config.d/bottread-dcaproxy.conf, then `sshd -t && systemctl reload ssh`.
Match User dcaproxy
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:8787
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTTY no
